name: Deploy Website to AWS S3

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files exist
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Verify index.html contains DevOps Training
        run: grep -q "DevOps Training" index.html

  build:
    name: Build/Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: website-package
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy website files to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ --exclude "*" --include "index.html" --include "style.css" --include "script.js"
